# Included in every block that sets its own add_header: nginx drops server-level
# add_header directives in any location that defines one.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# The console loads no third-party script. Product photos are external https links until
# images are served from S3; fonts come from Google Fonts; the socket uses ws(s).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' wss: ws:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
# Staff pages must never be indexed or cached by shared proxies.
add_header X-Robots-Tag "noindex, nofollow" always;
